<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゼロから英語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 1画面1操作。上にタブとドット、中央に問題カード。色は全章で固定（名詞系=青、動詞=赤、なにを=緑青、様子=黄緑、時場所=紫）。アクセントは淡い黄色 */
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --fg:#1B2433; --muted:#5B6779; --line:#D5DDE8;
  --noun:#1F5FBF; --verb:#D13A3A; --adj:#4C8A0F; --obj:#1B7F62; --adv:#6B52B0; --cmp:#B8407A;
  --accent:#8A6D00; --fill:#F7E08A; --on:#3A2F05; --ok:#1B7F62; --ng:#D13A3A;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --en:"Nunito","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111823; --card:#1A2433; --fg:#E8EDF5; --muted:#9AA8BD; --line:#2B394E;
    --noun:#7DAEF5; --verb:#FF8080; --adj:#9BD35A; --obj:#55CBA3; --adv:#B3A6E8; --cmp:#F08CC0;
    --accent:#E9D27A; --fill:#E9D27A; --on:#2A2205; --ok:#55CBA3; --ng:#FF8080; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111823; --card:#1A2433; --fg:#E8EDF5; --muted:#9AA8BD; --line:#2B394E;
  --noun:#7DAEF5; --verb:#FF8080; --adj:#9BD35A; --obj:#55CBA3; --adv:#B3A6E8; --cmp:#F08CC0;
  --accent:#E9D27A; --fill:#E9D27A; --on:#2A2205; --ok:#55CBA3; --ng:#FF8080; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:16px;line-height:1.7;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.stretch{font-weight:700;letter-spacing:.04em}
.test{margin:10px 0;padding:10px 12px;border:2px solid var(--accent);border-radius:12px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tab{flex:1 1 22%;min-width:0;font-size:13px;min-height:44px;padding:2px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fill);color:var(--on);border-color:var(--accent)}
.rvbtn{width:100%;min-height:40px;margin-bottom:12px;border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.rvbtn[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--fg);background:var(--fill);color:var(--on)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;align-items:center}
.dot{width:16px;height:16px;padding:0;border:0;border-radius:5px;background:var(--line);cursor:pointer}
.dot.ss{margin-left:10px}
.dot.done{background:var(--ok)}
.dot.now{outline:2px solid var(--accent);outline-offset:1px}
.dots small{color:var(--muted);margin-left:auto;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.card h2{font-size:18px;margin:0 0 8px}
.card p{margin:0 0 10px}
.q{font-size:13px;color:var(--muted);margin:0 0 10px}
.hint{font-size:14px;margin:0 0 10px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.sent{font-size:26px;line-height:2.1;margin:6px 0 14px;font-weight:500}
.sent.enw{font-family:var(--en);font-weight:800;font-size:25px}
.w{font:inherit;font-size:inherit;font-weight:700;border:0;border-bottom:3px dashed var(--muted);background:transparent;color:var(--fg);padding:2px 4px;margin:0 2px;cursor:pointer;border-radius:4px;min-height:44px}
.w.sel{background:color-mix(in srgb,var(--accent) 16%,transparent);border-bottom-color:var(--accent)}
.w.done{cursor:default;border-bottom-style:solid}
.w.noun,.w.S{color:var(--noun);border-bottom-color:var(--noun)}
.w.verb,.w.V{color:var(--verb);border-bottom-color:var(--verb)}
.w.adj{color:var(--adj);border-bottom-color:var(--adj)}
.w.O{color:var(--obj);border-bottom-color:var(--obj)}
.w.M{color:var(--adv);border-bottom-color:var(--adv)}
.w.C,.w.P{color:var(--cmp);border-bottom-color:var(--cmp)}
.w.N{color:var(--adv);border-bottom-color:var(--adv)}
.w.Sp{color:var(--noun);border-bottom-color:var(--noun)}
.w.Op{color:var(--obj);border-bottom-color:var(--obj)}
.w.be{color:var(--adv);border-bottom-color:var(--adv)}
.w.gen{color:var(--verb);border-bottom-color:var(--verb)}
span.w{display:inline-block;min-height:0}
.w small{display:block;font-family:var(--jp);font-size:11px;font-weight:700;line-height:1.2;margin-top:-6px}
.cats{display:grid;gap:8px}
.cat{min-height:64px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font:inherit;font-weight:700;cursor:pointer;padding:6px 2px;line-height:1.3;font-size:15px}
.cat span{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.cat.noun,.cat.S{border-color:var(--noun)} .cat.verb,.cat.V{border-color:var(--verb)} .cat.adj{border-color:var(--adj)}
.cat.O{border-color:var(--obj)} .cat.M{border-color:var(--adv)} .cat.C,.cat.P{border-color:var(--cmp)} .cat.N{border-color:var(--adv)} .cat.Sp{border-color:var(--noun)}
.cat.pk.sm{font-size:17px}
.gap{min-width:40px;min-height:40px;border:2px dashed var(--muted);border-radius:10px;background:transparent;color:var(--muted);font-size:20px;margin:0 2px;cursor:pointer;font-family:var(--en);font-weight:800} .cat.Op{border-color:var(--obj)} .cat.be{border-color:var(--adv)} .cat.gen{border-color:var(--verb)}
.cat.pk{font-family:var(--en);font-weight:800;font-size:24px}
.tbl{width:100%;border-collapse:collapse;font-family:var(--en);font-weight:800;font-size:17px;text-align:center;margin:8px 0}
.tbl th{font-family:var(--jp);font-size:12px;font-weight:700;padding:4px 2px}
.tbl td{padding:3px 2px;border-top:1px solid var(--line)}
.clue{margin:0 0 10px;font-size:15px}
.blank{display:inline-block;min-width:2.6em;border-bottom:3px dashed var(--muted);text-align:center}
.cat:disabled{opacity:.4;cursor:default}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--fg);border:1px solid var(--ok)}
.msg.ng{background:color-mix(in srgb,var(--ng) 13%,transparent);color:var(--fg);border:1px solid var(--ng)}
.point{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.point b{color:var(--accent)}
.next{display:block;width:100%;min-height:50px;margin-top:14px;border:1px solid var(--accent);border-radius:12px;background:var(--fill);color:var(--on);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:0 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.slots{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.slot{display:flex;align-items:center;gap:10px;min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:4px 10px}
.slot .n{font-size:12px;color:var(--muted);width:3.2em;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:54px}
.chip{min-height:46px;padding:6px 16px;border-radius:12px;border:2px solid;background:var(--card);font:inherit;font-weight:700;font-size:18px;cursor:pointer;color:var(--fg)}
.r-S{border-color:var(--noun);color:var(--noun)} .r-V{border-color:var(--verb);color:var(--verb)}
.r-O{border-color:var(--obj);color:var(--obj)} .r-M{border-color:var(--adv);color:var(--adv)} .r-C{border-color:var(--cmp);color:var(--cmp)}
.slot.filled{border-style:solid;border-color:var(--line)}
.en{font-family:var(--en);font-weight:800;font-size:26px;line-height:1.5;margin:6px 0}
.en span{margin-right:.35em;white-space:nowrap}
.r-D{border-color:var(--adv);color:var(--adv)} .en .D{color:var(--adv)} .w.D{color:var(--adv);border-bottom-color:var(--adv)} .r-Q{border-color:var(--accent);color:var(--accent)} .en .Q{color:var(--accent)} .w.Q{color:var(--accent);border-bottom-color:var(--accent)} .cat.Q{border-color:var(--accent)} .en .S{color:var(--noun)} .en .V{color:var(--verb)} .en .O{color:var(--obj)} .en .M{color:var(--adv)} .en .C{color:var(--cmp)}
.ja{color:var(--fg);font-size:20px;font-weight:700;line-height:1.6;margin:0 0 8px}
.cmp{display:grid;gap:10px;margin:10px 0}
.cmp div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.cmp b{font-size:12px;color:var(--muted);display:block;font-weight:500}
.defs{display:grid;gap:8px;margin:10px 0}
.defs div{border-left:5px solid;padding:6px 10px;background:var(--bg);border-radius:0 8px 8px 0}
.defs .n{border-color:var(--noun)} .defs .v{border-color:var(--verb)} .defs .a{border-color:var(--adj)}
.defs span{color:var(--muted);font-size:14px;display:block}
.speak{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.rv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rv .sent{margin:0 0 6px;font-size:22px;line-height:1.9}
.rv .sent.enw{font-size:22px}
.rv .en{font-size:22px}
.rv .point{font-size:14px;margin-top:6px}
.rvsec{font-size:14px;font-weight:700;color:var(--accent);margin:16px 0 6px}
.chunks{font-size:13px;color:var(--muted);margin:0 0 4px}
ruby{ruby-position:over}
rt{font-family:var(--jp);font-size:max(.45em,9px);font-weight:500;letter-spacing:0;color:var(--muted);font-style:normal}
.w.sel rt,.w.done rt{color:inherit;opacity:.8}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.msg{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
#app{scroll-margin-top:10px}
</style>
</head>

しい否定文はどれ？", "④ not を入れる場所"], ["① 肯定文を疑問文に並べかえ", "② Was / Were を最初へ、? をつける", "③ 疑問文への答え方", "④ Where were you?"], ["ミックス（was・were）"], ["① 今のこと？ 前のこと？", "② ed の作り方", "③ 過去の文を並べかえ", "④ 正しい英文はどれ？"], ["① 過去形を選ぶ", "② 現在の文→過去の文", "③ 不規則な過去の文を並べかえ", "④ 正しい英文はどれ？"], ["① did not を選ぶ", "② 否定の文を並べかえ", "③ 正しい否定文はどれ？", "④ not を入れる場所"], ["① 肯定文を疑問文に並べかえ", "② Did を最初へ、動詞を原形に", "③ 疑問文への答え方", "④ What did you do?"], ["ミックス（過去形）"], ["全復習テスト（第0〜43章）"], ["① a？ an？", "② a？ the？", "③ 文を並べかえ", "④ 正しい英文はどれ？"], ["① 複数形を選ぶ（s・es・ies）", "② 形がかわる複数形", "③ 複数の文を並べかえ", "④ 正しい英文はどれ？"], ["① this・that・these・those を選ぶ", "② is？ are？", "③ 文を並べかえ", "④ 正しい英文はどれ？"], ["① 前置詞はどれ？", "② 場所の前置詞（on・in・under …）", "③ 場所の文を並べかえ", "④ 正しい英文はどれ？"], ["① 時の前置詞（at・on・in）", "② before・after（〜の前に・〜のあとに）", "③ with・without・from・to・for・by", "④ 文を並べかえ"], ["ミックス（名詞・冠詞・前置詞）"], ["① is？ are？", "② There was / were（過去）", "③ There is / are の文を並べかえ", "④ 正しい英文はどれ？"], ["① is not？ are not？", "② a・an・any を選ぶ", "③ 否定の文を並べかえ", "④ not を入れる場所"], ["① 疑問文に並べかえ", "② Is / Are を最初へ、? をつける", "③ 疑問文への答え方", "④ How many 〜 are there?"], ["ミックス（There is / are）"]],SECPTS=[null, ["日本語は動詞が最後。英語は<b>主語のすぐあと</b>に動詞が来ます。順番は「<b>だれが→どうする→なにを</b>」。", "「いつ・どこで」は、日本語では前にあるのに、英語では<b>いちばん最後</b>に置くのがふつうです。", "英語は「<b>だれが→どうする→なにを</b>」の順。動詞が最後や先頭にある文は、まちがいです。"], ["主語が <b>I</b>→am、<b>you</b>→are、<b>1人・1つ</b>→is、<b>2人以上</b>→are。", "日本語の「です」は最後。英語では<b>主語のすぐあと</b>（2番目）に be動詞を置きます。順番は「だれが→です→なに・どんな」。", "「〜です」は、主語のすぐあとに be動詞（am・are・is）。「be動詞がない」「最後にある」「先頭にある」はまちがいです。", "<b>be動詞</b>は「〜です」（am・are・is）。<b>一般動詞</b>は動き（eat, play など）。1つの文に、ふつうどちらか1つ。"], ["否定文は <b>be動詞のあとに not</b>。I→am not、you→are not、1人・1つ→is not、2人以上→are not。「do not」は使いません。", "日本語の「ではありません」は最後。英語では<b>主語のすぐあと</b>に「be動詞＋not」を置きます。", "not は be動詞の<b>すぐあと</b>。「not が前」「not が最後」「do / does not」はまちがいです。", "<b>not は be動詞のすぐうしろ</b>。肯定文に not を1つ入れるだけで、否定文になります。"], ["疑問文は<b>be動詞を文のいちばん最初</b>に出します。主語はそのあと。最後は「？」。（You are → Are you）", "日本語は「あなたは〜ですか」だけど、英語は <b>Are you</b> のように be動詞から始めます。", "「Are you 〜?」と聞かれたら「Yes, I am.」。be動詞の質問には、<b>be動詞で答える</b>（do は使わない）。聞かれた you は、答えるときは <b>I</b> になります。", "be動詞で始まる文は<b>疑問文</b>なので最後は「<b>?</b>」。主語で始まる文は「<b>.</b>」。始まりを見れば分かります。"], [""], ["<b>1行目 は・が</b>→I　<b>2行目 の</b>→my　<b>3行目 を・に</b>→me　<b>4行目 のもの</b>→mine。日本語の助詞を見れば何行目か決まります。", "you・he・she・we・they も同じ4行。「2行目（の）」は名詞の前、「3行目（を・に）」は動詞のあと。", "代名詞でも順番は「だれが→どうする→だれを」。「彼を」は3行目の him、「私を」は3行目の me。", "<b>1行目（は・が）</b>は文の最初、<b>2行目（の）</b>は名詞の前、<b>3行目（を・に）</b>は動詞のあと。置かれた場所を見れば分かります。"], ["<b>be動詞</b>は「〜です」（am・are・is）。<b>一般動詞</b>は動き（のばすと「う」になる）。1つの文に、どちらか1つだけ使います。", "一般動詞の文は <b>だれが → どうする → なにを</b>。「いつ・どこで」は最後。日本語の動詞は最後だけど、英語は2番目。", "be動詞（am・are・is）と一般動詞は<b>いっしょに使いません</b>。「I am eat ramen.」はまちがいです。動詞は主語のすぐあと。", "日本語の意味に合う<b>動詞</b>を選びます。動詞は主語のすぐあとに置きます。"], ["<b>一般動詞</b>（eat など）の文→<b>do not</b>。<b>be動詞</b>（am・are・is）の文→<b>am not / are not</b>。動詞の種類を見て選びます。", "日本語の「〜ません」は最後。英語では<b>主語のすぐあと</b>に do not、そのあとに動詞。順番は「だれが→do not→どうする→なにを」。", "否定文は <b>do not ＋ 動詞</b>。「not だけ」「be動詞＋動詞」「動詞のあとに not」はまちがいです。", "<b>do not は動詞のすぐ前</b>（主語のすぐあと）。肯定文に do not を入れるだけで、否定文になります。"], ["一般動詞の疑問文は<b>Do を文のいちばん最初</b>に出します。主語はそのあと、動詞は主語のすぐあと。最後は「？」。（You eat → Do you eat）", "肯定文の<b>いちばん最初</b>に Do を入れて、最後を「<b>?</b>」にすると疑問文になります。（You eat ramen. → Do you eat ramen?）", "「Do you 〜?」と聞かれたら「Yes, I do. / No, I do not.」。一般動詞の質問には、<b>do で答える</b>（am や are は使わない）。聞かれた you は、答えるときは <b>I</b> になります。", "<b>一般動詞</b>（eat など）の疑問文は <b>Do</b>、<b>be動詞</b>の疑問文は <b>Are / Is / Am</b> で始めます。"], [""], ["主語が<b>1人・1つ</b>（he・she・Tom・my mother など）で今のことを言うときは、動詞に <b>s</b> をつけます。<b>I・you・we・they・複数</b>は s なし。", "ふつうは <b>s</b>（eat→eats）。<b>o・ch・sh・s</b> で終わる語は <b>es</b>（go→goes, watch→watches）。<b>子音＋y</b> は y を取って <b>ies</b>（study→studies）。", "三単現の文も <b>だれが → どうする → なにを</b>。動詞には s がつきます。be動詞（is）はいりません。", "主語が1人なら動詞に s。「Tom eat ramen.」の s ぬけや、「Tom is eats ramen.」のように be動詞を混ぜるのはまちがいです。"], ["主語が<b>1人</b>（he・she・Tom など）の一般動詞→<b>does not</b>。<b>I・you・we・they・複数</b>の一般動詞→<b>do not</b>。<b>be動詞</b>の文→<b>is not など</b>。", "日本語の「〜ません」は最後。英語は<b>主語のすぐあと</b>に does not、そのあとに動詞。順番は「だれが→does not→どうする→なにを」。", "does not のあとの動詞は、<b>s のない形</b>（原形）。「does not eats」は、まちがいです。", "<b>does not は動詞の前</b>。does not を入れたら、動詞の s は取れて原形にもどります（eats→eat）。"], ["1人が主語の疑問文は<b>Does を文のいちばん最初</b>に出します。動詞は s のない形にもどります。（Tom eats → Does Tom eat）", "肯定文の<b>いちばん最初</b>に Does を入れると、動詞の <b>s は取れて</b>原形にもどります。（Tom eats ramen. → Does Tom eat ramen?）", "「Does he 〜?」と聞かれたら「Yes, he does. / No, he does not.」。一般動詞の質問には、<b>does（do）で答える</b>。is は使いません。", "<b>1人＋動き</b>→<b>Does</b>／<b>I・you・複数＋動き</b>→<b>Do</b>／<b>1人＋〜です</b>→<b>Is</b>／<b>you・複数＋〜です</b>→<b>Are</b>。"], [""], [""], ["<b>can</b> は<b>助動詞</b>（動詞を助けることば）。あとの動詞は、主語がだれでも <b>s のない形</b>（原形）。「Tom can eats」はまちがいです。", "can は<b>主語のすぐあと</b>。順番は「だれが → can → どうする → なにを」。日本語の「〜ことができる」は最後だけど、英語は動詞の前。", "<b>can ＋ 動詞（原形）</b>。「cans」「can eats」「can to eat」はまちがい。can は形が変わりません。", "<b>can</b> は「〜できる」。can がない文は「〜する」、can の否定は「〜できない」。1語あるかないかで意味が変わります。"], ["日本語が「<b>できません</b>」なら <b>cannot</b>。「しません」なら do not / does not。「〜ではありません」なら is not など。日本語の意味で選びます。", "cannot は<b>主語のすぐあと</b>。順番は「だれが → cannot → どうする → なにを」。cannot のあとの動詞は s なし。", "<b>cannot ＋ 動詞（原形）</b>。「does not can」「not can」「cannot eats」はまちがいです。", "<b>not は can のすぐあと</b>に入れて、くっつけて <b>cannot</b>。do / does は使いません。"], ["<b>Can</b> を文のいちばん最初に出します。主語はそのあと、動詞は s なしのまま。最後は「？」。（You can swim → Can you swim?）", "疑問文では <b>can</b> を文の最初に動かします。動かしたら最後は「<b>?</b>」。do / does は使いません。", "「Can you 〜?」と聞かれたら「Yes, I can. / No, I cannot.」。<b>can で答える</b>（do は使わない）。聞かれた you は、答えるときは <b>I</b>。", "<b>できますか</b>→<b>Can</b>／<b>しますか</b>→<b>Do / Does</b>／<b>〜ですか</b>→<b>Is / Are</b>。日本語の意味で選びます。"], [""], ["<b>What</b>＝なに／<b>Who</b>＝だれ／<b>Where</b>＝どこ／<b>When</b>＝いつ／<b>Why</b>＝なぜ。これを<b>疑問詞</b>といいます。", "<b>What</b>→もの／<b>Who</b>→人／<b>Where</b>→場所／<b>When</b>→時。疑問詞の質問には、<b>Yes / No では答えません</b>。", "日本語は疑問詞が途中にあるけど、英語では<b>文の最初</b>。こたえが「人」なら Who、「場所」なら Where、「時」なら When、「もの」なら What。", "文の中の<b>たずねたい部分</b>を、疑問詞に変えます。人→Who／もの→What／場所→Where／時→When。"], ["疑問詞は<b>文の最初</b>。そのあとは be動詞の疑問文と同じ（be動詞 → 主語）。順番は「疑問詞 → be動詞 → 主語」。", "こたえの種類（人・もの・場所・時）で、使う疑問詞が決まります。", "疑問詞の質問には、<b>Yes / No では答えず</b>、こたえの中身を言います。", "<b>疑問詞 ＋ be動詞 ＋ 主語</b>。「Is what this?」「What this is?」「This is what?」はまちがい。"], ["一般動詞の疑問詞の疑問文は<b>疑問詞 → Do / Does → 主語 → 動詞</b>。疑問詞のあとは、Do の疑問文と同じ形です。", "<b>動き（一般動詞）</b>なら <b>do / does</b>、<b>〜です（be動詞）</b>なら <b>are / is</b>。主語が1人なら does / is。", "疑問詞の質問には<b>Yes / No で答えず</b>、中身を答えます。聞かれた you は、答えるときは <b>I</b>。", "<b>疑問詞 ＋ do / does ＋ 主語 ＋ 動詞（s なし）</b>。do / does がぬけたり、動詞に s が残ったりするのはまちがいです。"], [""], ["<b>How</b> のあとの語で意味が決まります。<b>How old</b>＝何歳／<b>How many ＋ 名詞</b>＝いくつ／<b>How much</b>＝いくら／<b>How</b> だけ＝どう・どうやって。", "How の疑問文も、順番は同じ。<b>How ○○ → be動詞（または do / does）→ 主語 → 動詞</b>。", "How の質問には<b>Yes / No で答えず</b>、年齢・数・値段・方法など、中身を答えます。", "<b>How ○○ ＋ be動詞 ＋ 主語</b>。「You are how old?」「How you are old?」「Are how old you?」はまちがい。"], ["<b>Whose</b>＝だれの（持ち主）／<b>Which</b>＝どれ・どの（選ぶ）／<b>Why</b>＝なぜ（理由）。", "順番は同じ。<b>疑問詞（Whose ○○・Which ○○）→ be動詞 / do / does → 主語 → 動詞</b>。Whose bag や Which book はセットで最初に出します。", "<b>Whose</b> には「It is my bag.」（持ち主）。<b>Which</b> には「this / that」で選んだものを。<b>Why</b> には「<b>Because</b> 〜」（なぜなら）で理由を答えます。", "<b>Whose bag</b>、<b>Which book</b> はセット。ばらばらにしたり、順番を変えたりするのはまちがいです。"], [""], ["現在進行形は<b>be動詞（am・are・is）＋ 動詞ing</b>。be動詞は主語で決まります（I→am、you・複数→are、1人→is）。", "<b>ふつうは ing をつけるだけ</b>。<b>e で終わる語は e を取って ing</b>（use→using）。<b>短い語の最後の1文字は重ねて ing</b>（run→running, swim→swimming）。", "日本語の「〜している」は最後。英語は「<b>だれが → be動詞 → 動詞ing → なにを</b>」。be動詞は主語のすぐあと。", "<b>be動詞 ＋ 動詞ing</b> のセット。be動詞がぬけたり、ing がぬけたり、be動詞の形がちがったりはまちがいです。"], ["<b>〜している</b>（動詞ing）の否定は <b>be動詞＋not</b>。<b>ing がない</b>ふつうの動きの文は <b>do / does not</b>。ing の有無を見て選びます。", "「〜していません」は最後。英語は「<b>だれが → be動詞＋not → 動詞ing → なにを</b>」。not は be動詞のすぐあと。", "<b>be動詞 ＋ not ＋ 動詞ing</b>。「does not eating」「is eating not」「not is eating」はまちがいです。", "<b>not は be動詞のすぐあと</b>。ing のままで、do / does は使いません。"], ["<b>be動詞を文のいちばん最初</b>に出します。主語はそのあと、動詞ing はそのまま。最後は「？」。（You are eating → Are you eating?）", "疑問文では<b>be動詞を文の最初に動かして</b>、最後を「<b>?</b>」にします。do / does は使いません。", "「Are you 〜ing?」と聞かれたら「Yes, I am. / No, I am not.」。<b>be動詞で答える</b>（do は使わない）。聞かれた you は、答えるときは <b>I</b>。", "<b>What ＋ be動詞 ＋ 主語 ＋ doing?</b>＝何をしていますか。疑問詞は最初、そのあとは進行形の疑問文と同じ。"], [""], ["「〜しなさい」と命令やお願いをする文を<b>命令文</b>といいます。<b>主語（you）を言わず、動詞（原形）で文を始めます</b>。", "命令文の動詞は<b>もとの形（原形）</b>。s も ing もつけません。", "命令文は「<b>どうする → なにを</b>」。主語がないので、<b>動詞が1番目</b>です。", "主語を言わず、動詞だけで始めます。「You eat ramen.」は命令ではなくふつうの文、「Eating ramen.」「Eats ramen.」もまちがいです。"], ["「〜してはいけません」と禁止する文は、<b>Do not ＋ 動詞</b>（原形）。命令文の前に <b>Do not</b> をつけます。（短く <b>Don't</b> とも言います。）", "「してはいけません」は最後。英語は「<b>Do not → 動詞 → なにを</b>」。禁止の文も主語はいりません。", "<b>Do not ＋ 動詞</b>。「Not eat」「Eat not」「Does not」はまちがいです。動詞は原形のままです。", "<b>Do のあとに not</b>。そのあとは動詞（原形）。"], ["<b>Please</b> を文の最初につけると、ていねいなお願いになります（Please open the door.＝ドアを開けてください）。", "<b>Let's ＋ 動詞（原形）</b>＝「〜しましょう」とさそう文。主語はなく、動詞は原形です。", "「ましょう」は最後。英語は「<b>Let's → 動詞 → なにを</b>」。", "<b>Be ＋ 様子</b>（Be quiet.＝静かにしなさい）。「です」にあたる be動詞も、命令文では<b>原形の Be</b>。禁止は <b>Do not be 〜</b>。"], [""], ["「〜でした」は <b>was / were</b>。am・is の過去形が <b>was</b>、are の過去形が <b>were</b>。主語は I・1人→was、you・複数→were。", "今のことを前のことにするときは、<b>am・is → was</b>、<b>are → were</b>。主語は同じ、形だけ変えます。", "過去の文も順番は同じ。<b>だれが → was / were → なに</b>。be動詞は主語のすぐあと。", "<b>主語に合った was / were</b>。am・is・are は今のことなのでここでは使いません。was と were の取りちがいもまちがいです。"], ["「〜ではありませんでした」は <b>was not / were not</b>。be動詞のあとに <b>not</b> を置くだけです。", "「ではありませんでした」は最後。英語は「<b>だれが → was / were not → なに</b>」。", "<b>was / were ＋ not</b>。do not や did not は使いません。not の位置は be動詞のすぐあとです。", "<b>not は was / were のすぐあと</b>。"], ["<b>was / were を文のいちばん最初</b>に出します。主語はそのあと。最後は「？」。（You were happy. → Were you happy?）", "疑問文では <b>Was / Were を文の最初に動かして</b>、最後を「<b>?</b>」にします。did は使いません。", "「Were you 〜?」と聞かれたら「Yes, I was. / No, I was not.」。<b>was / were で答える</b>。聞かれた you は、答えるときは <b>I</b>。", "<b>Where ＋ was / were ＋ 主語?</b>＝どこにいましたか。疑問詞は最初、そのあとは疑問文と同じ。"], [""], ["前のこと（過去）を言うときは、動詞を<b>過去形</b>にします。ふつうは動詞の最後に <b>ed</b> をつけます。<b>主語がだれでも形は同じ</b>（s も関係なし）。<b>yesterday（昨日）・last night（昨夜）・last week（先週）</b>は、前のことを表すサインです。", "<b>ふつうは ed</b>（play→played）。<b>e で終わる語は d だけ</b>（use→used）。<b>子音＋y は y を i にして ed</b>（study→studied）。<b>短い語の最後は重ねて ed</b>（stop→stopped）。", "過去の文も順番は同じ。<b>だれが → どうした → なにを → いつ</b>。いつ（yesterday など）は最後。", "前のことなら動詞は過去形。「I play tennis yesterday.」（原形）や「I did played」はまちがいです。"], ["ed をつけずに<b>形がかわる</b>動詞があります（不規則変化）。go→<b>went</b>、eat→<b>ate</b>、see→<b>saw</b> は、そのまま覚えます。", "今の文を前の文にするときは、動詞を過去形に。<b>三単現の s は消えます</b>（Tom eats → Tom ate）。", "順番は同じ。<b>だれが → どうした（形がかわった動詞）→ なにを → いつ</b>。", "「I goed」「I eated」のように ed をつけるのはまちがい。形がかわる動詞は<b>覚えた形</b>を使います。"], ["「〜しませんでした」は <b>did not ＋ 動詞（原形）</b>。<b>did</b> が過去を持っているので、あとの動詞はもとの形にもどります。", "「しませんでした」は最後。英語は「<b>だれが → did not → 動詞 → なにを</b>」。", "<b>did not ＋ 原形</b>。「did not played」「not played」はまちがい。be動詞（was）は使いません。", "<b>not は did のすぐあと</b>。そのあとは原形です。"], ["<b>Did を文のいちばん最初</b>に出します。主語、<b>原形の動詞</b>、なにを、の順。最後は「？」。", "疑問文では <b>Did を文の最初に置いて</b>、動詞は<b>もとの形</b>にもどします（過去は Did が持つ）。", "「Did you 〜?」と聞かれたら「Yes, I did. / No, I did not.」。<b>did で答える</b>。聞かれた you は、答えるときは <b>I</b>。", "<b>What did ＋ 主語 ＋ 動詞（原形）?</b>＝何を〜しましたか。疑問詞は最初、そのあとは Did の疑問文と同じ。"], [""], [""], ["数えられるもの1つには <b>a</b> をつけます。<b>母音の音（ア・イ・ウ・エ・オ）で始まる語</b>の前は <b>an</b>（an apple）、それ以外は <b>a</b>（a dog）。", "初めて出てくるものは <b>a</b>、<b>もう話に出た「その〜」</b>は <b>the</b>（I have a dog. <b>The</b> dog is cute.）。", "順番は「<b>だれが → どうする → なにを</b>」。「a ＋ 名詞」は<b>ひとまとまり</b>で動かします。", "1つのものには <b>a / an</b> が必要です。母音の音の前は an、子音の音の前は a。ぬけたり、まちがえたりしないように。"], ["2つ以上のときは名詞に <b>s</b>（dog→dogs）。<b>s・x・ch・sh</b> で終わる語は <b>es</b>（box→boxes）。<b>子音＋y</b> は <b>y を i にして es</b>（baby→babies）。", "<b>形がかわる複数形</b>があります。man→<b>men</b>、woman→<b>women</b>、child→<b>children</b>。fish は<b>そのまま</b>（fish）。", "複数のものも順番は同じ。<b>だれが → どうする → なにを</b>。数（two など）は名詞の前。", "2つ以上なら名詞は複数形。<b>two dog</b> のように s がぬけたり、<b>a dogs</b> のように a と s を両方つけたりしないよ。"], ["<b>近く</b>のもの：1つ→<b>this</b>、2つ以上→<b>these</b>。<b>遠く</b>のもの：1つ→<b>that</b>、2つ以上→<b>those</b>。", "<b>this・that</b> は1つなので <b>is</b>。<b>these・those</b> は2つ以上なので <b>are</b>。", "「これは〜です」も順番は <b>だれが → です → なに</b>。<b>This is 〜.</b> が文の最初。", "1つなら <b>This / That ... is</b>、複数なら <b>These / Those ... are</b>。名詞も複数のときは s をつけます。"], ["<b>前置詞</b>は、<b>名詞の前に置く小さな言葉</b>。「どこに・いつ・だれと」のような<b>くわしい情報</b>をつけ足します（on the desk＝机の上に）。前置詞のあとには<b>名詞</b>（desk・school など）か<b>動名詞</b>（eating のような「動詞＋ing」で、「〜すること」）が来ます。動名詞は、あとの章で習います。", "場所をしめす前置詞：<b>on</b>＝〜の上に（くっついて）、<b>in</b>＝〜の中に、<b>under</b>＝〜の下に、<b>by・near</b>＝〜のそばに。", "場所をいう言葉は文の最後。<b>だれが → です / います → どこに</b>。「on the desk」は<b>ひとまとまり</b>。", "前置詞は意味が大切。「机の上」は <b>on</b>、「箱の中」は <b>in</b>、「いすの下」は <b>under</b>。"], ["時をしめすときは、<b>at</b>＋時刻（at seven）、<b>on</b>＋曜日・日付（on Sunday）、<b>in</b>＋月・季節・年（in April）。", "<b>before</b>＝〜の前に、<b>after</b>＝〜のあとに。名詞の前に置きます（before lunch＝昼食の前に）。", "<b>with</b>＝〜といっしょに、<b>without</b>＝〜なしで、<b>from</b>＝〜から、<b>to</b>＝〜へ、<b>for</b>＝〜のために、<b>by</b>＝〜で（手段）。", "前置詞のかたまり（with my friends など）は<b>文の最後ちかく</b>。<b>だれが → どうする → なにを → くわしい情報</b>。"], [""], ["「〜があります・〜がいます」は <b>There is / There are ＋ 名詞 ＋ 場所</b>。<b>あとの名詞が1つなら is、2つ以上なら are</b>。", "前のこと（過去）は <b>There was / There were</b>。<b>1つなら was、2つ以上なら were</b>。yesterday（昨日）・last night（昨夜）が目印です。", "日本語は「場所に → 名詞が → あります」。英語は「<b>There is / are → 名詞 → 場所</b>」。There is / are が<b>最初</b>。", "<b>There is / are</b> のあとに名詞。名詞が1つなら is、複数なら are。「It is 〜」は「それは〜です」の文で、「ある」ではありません。"], ["「〜がありません・いません」は <b>There is not / There are not</b>。be動詞のあとに <b>not</b>。do や does は使いません。", "否定の文で、<b>1つ</b>なら <b>a / an</b>（There is not <b>a</b> book.）、<b>複数</b>なら <b>any</b>（There are not <b>any</b> books.）。any は「ひとつも」の意味です。", "日本語は「場所に → 名詞は → ありません」。英語は「<b>There is / are not → 名詞 → 場所</b>」。", "<b>not は is / are のすぐあと</b>。複数のときは some を any にかえます。"], ["<b>Is / Are を文のいちばん最初</b>に出します。<b>Is there 〜? / Are there 〜?</b>。複数のときは some を any にかえます。", "疑問文では <b>is / are を There の前</b>に動かして、最後を「<b>?</b>」にします（There is → Is there）。", "「Is there 〜?」には <b>Yes, there is. / No, there is not.</b>、「Are there 〜?」には <b>Yes, there are. / No, there are not.</b>。there で答えます（it や they は使いません）。", "<b>How many ＋ 複数名詞 ＋ are there ＋ 場所?</b>＝いくつありますか。数を聞 var lastK='';
function render(){ renderInner(); if(i>=0&&!review){var kk=ch+'-'+i; if(kk!==lastK){lastK=kk; try{ if($app.scrollIntoView) $app.scrollIntoView({block:'start'}); }catch(e){}}} else if(i<0) lastK=''; if(ch===44&&!review&&i>=0&&i<data().length&&$app.querySelector('.msg.ng')) data()[i].miss=1; rubify($app); rubify($tabs); }
function renderInner(){
  dots();

  if(i===-1) return intro();

/* ---------- 自動ポイント・理由 ---------- */
function autoPoint(q){
  var T=q.parts.filter(function(p){return p.k;});
  if(q.cats==='pos'){
    return '<b>のばしテスト</b><br>'+T.map(function(p){
      if(p.k==='verb') return p.t+'ぅ〜 →「う」だから<b>動詞</b>';
      if(p.k==='adj') return p.t+'ぃ〜 →「い」だから<b>形容詞</b>';
      return p.t+' →のばせない。ものの名前だから<b>名詞</b>';
    }).join('<br>');
  }
  var V=T.filter(function(p){return p.k==='V';}).map(function(p){return p.t+'ぅ〜';}).join('・');
  return '主語は「は・が」がつく<b>だれが</b>。動詞は<b>どうする</b>で、日本語では文の最後に来る（'+V+'）。「を」がつくのは<b>なにを</b>。';
}
function ptOf(q){
  if(q.p) return q.p;
  if(ch>=1) return (SECPTS[ch]&&SECPTS[ch][q.sec])||'';
  return autoPoint(q);
}
function reason(q,p){
  var k=p.k,t=p.t;
  if(k==='noun') return '「'+t+'」は、もの・人・場所の<b>名前</b>だよ。動きでも様子でもないので、名詞。';
  if(k==='verb') return '「'+t+'」は<b>動き</b>。のばしてみよう →「'+t+'ぅ〜」。最後が「う」になるのは動詞だよ。';
  if(k==='adj') return '「'+t+'」は、ものの<b>様子</b>を表すよ。最後が「い」で、「'+t+'ぃ〜」とのばしても「い」。これが形容詞。';
  if(k==='S') return q.en?'「'+t+'」は<b>主語</b>（だれが）。文のはじめにあって、動詞の前にいるよ。':'「'+t+'」は<b>主語</b>（だれが）。「は」「が」がつくことが多いよ。';
  if(k==='V') return q.en?'「'+t+'」は<b>動詞</b>（どうする）。主語のすぐあとにあるよ。':'「'+t+'」は<b>動詞</b>（どうする）。のばすと「'+t+'ぅ〜」。日本語では文の最後に来るよ。';
  if(k==='O') return '「'+t+'」は<b>なにを</b>にあたる語。'+(q.en?'動詞のあとに来るよ。':'「を」がつくよ。');
  if(k==='Sp') return '「'+t+'」は<b>1行目（は・が）</b>の形（主語）。文の最初で、動詞の前に来るよ。';
  if(k==='P') return '「'+t+'」は<b>2行目（〜の）</b>の形。名詞の前に置いて、持ち主を表すよ。';
  if(k==='Op') return '「'+t+'」は<b>3行目（を・に）</b>の形（目的語）。動詞のあとに来るよ。';
  if(k==='N') return '「'+t+'」は<b>打ち消し</b>の語。be動詞のすぐあとに置いて「〜ではない」にするよ。';
  if(k==='C') return '「'+t+'」は「です」の<b>中身</b>（なに・どんな）。名詞か形容詞が来るよ。be動詞のあとに置く。';
  if(k==='be') return '「'+t+'」は<b>be動詞</b>。「〜です」にあたる語（am・are・is）。';
  if(k==='gen') return '「'+t+'」は<b>一般動詞</b>。動き（のばすと「う」）を表す語。「〜です」ではないよ。';
  return '「'+t+'」は<b>いつ・どこで</b>（時や場所）を表す語。'+(q.en?'英語では文の最後に置くよ。':'');
}

function nextTarget(q,done){
  for(var k=0;k<q.parts.length;k++){ if(q.parts[k].k && !done[k]) return k; }
  return -1;
}
function sentHTML(q,done,sel,live){
  var h='';
  q.parts.forEach(function(p,k){
    if(p.k){
      var d=(done===true)||(done&&done[k]);
      if(live) h+='<button class="w'+(d?' done '+p.k:'')+(sel===k&&!d?' sel':'')+'" data-w="'+k+'">'+p.t+(d?'<small>'+KN[p.k]+'</small>':'')+'</button>';
      else h+='<span class="w done '+p.k+'">'+p.t+'<small>'+KN[p.k]+'</small></span>';
    } else h+='<span>'+p.t+'</span>';
  });
  return '<div class="sent'+(q.en?' enw':'')+'">'+h+'</div>';
}
function hintOf(q){
  if(q.cats==='role') return q.en?'英語でも、<b>主語（だれが）→動詞（どうする）</b>の順。それぞれの語をタップして選ぼう。'
      :'<b>主語</b>＝「は・が」がつく「だれが」。<b>動詞</b>＝「どうする」（文の最後）。<b>なにを</b>＝「を」がつく。<b>いつ・どこ</b>＝時や場所。';
  if(q.cats==='roleC') return '英語の「〜です」の文は <b>主語 → be動詞 → 中身</b> の順。';
  if(q.cats==='negC') return '否定文は <b>主語 → be動詞 → not → 中身</b> の順。';
  if(q.cats==='pron') return '<b>1行目（は・が）</b>＝文の最初／<b>2行目（〜の）</b>＝名詞の前／<b>3行目（を・に）</b>＝動詞のあと。';
  if(q.cats==='kind') return '<b>be動詞</b>＝「〜です」（am・are・is）。<b>一般動詞</b>＝動き（eat, play など）。';
  return '';
}

function classify(){
  var q=data()[i], key=ch+'-'+i;
  if(!st.cl||st.cl.key!==key){var d={};st.cl={key:key,done:d,sel:nextTarget(q,d),msg:'',ok:false};}
  var s=st.cl, all=nextTarget(q,s.done)===-1, cats=CATS[q.cats];
  var h='<div class="card"><p class="q">'+secs()[q.sec]+'　問題 '+(i+1)+' ／ '+data().length+'</p>';
  var ht=hintOf(q); if(ht) h+='<p class="hint">'+ht+'</p>';
  h+=sentHTML(q,s.done,s.sel,true);
  h+='<div class="cats" style="grid-template-columns:repeat('+cats.length+',minmax(0,1fr))">';
  cats.forEach(function(c){ h+='<button class="cat '+c+'" data-c="'+c+'"'+(all?' disabled':'')+'>'+KN[c]+'<span>'+SUB[c]+'</span></button>'; });
  h+='</div>';
  if(s.msg) h+='<div class="msg '+(s.ok?'ok':'ng')+'" role="status">'+s.msg+'</div>';
  if(all){
    h+='<div class="point">'+ptOf(q)+'</div>';
    if(q.tr) h+='<p class="ja" style="margin-top:8px">'+q.tr+'</p>';
    if(q.au) h+='<p style="margin-top:10px"><button class="speak" data-au="'+q.au+'">音声で聞く</button></p>';
    h+='<button class="next" data-a="next">'+(i===data().length-1?'おわり':'つぎへ')+'</button>';
  }
  h+='</div>';
  $app.innerHTML=h;
}

/* ---------- 並べかえ ---------- */
function expOrder(q){
  var R=q.q?(q.g?RANKQG:RANKQ):RANK, idx=q.items.map(function(_,k){return k;});
  idx.sort(function(a,b){return R[q.items[a].r]-R[q.items[b].r];});
  return idx;
}
function engHTML(q){
  var sp=expOrder(q).map(function(k){var x=q.items[k];return '<span class="'+x.r+'">'+x.en+'</span>';}).join('');
  return '<div class="en">'+sp+'<span style="margin:0">'+(q.q?'?':'.')+'</span></div>';
}
var LEG={S:['--noun','主語（だれが）'],D:['--adv','do / do not（動詞の前）'],Q:['--accent','疑問詞（なに・だれ・どこ）'],V:['--verb','動詞（どうする・です）'],O:['--obj','なにを'],C:['--cmp','中身（なに・どんな）'],M:['--adv','いつ・どこで']};
function legendHTML(q){
  var seen={}; q.items.forEach(function(x){seen[x.r]=1;});
  return '<p class="legend">'+['Q','S','D','V','O','C','M'].filter(function(r){return seen[r];}).map(function(r){return '<span><i style="background:var('+LEG[r][0]+')"></i>'+LEG[r][1]+'</span>';}).join('')+'</p>';
}
function q1(){
  var d=data(), q=d[i], n=q.items.length;
  if(!st.q1||st.q1.key!==ch+'-'+i){st.q1={key:ch+'-'+i,placed:[],msg:'',ok:false,locked:false};}
  var s=st.q1;
  var h='<div class="card"><p class="q">'+secs()[q.sec]+'　問題 '+(i+1)+' ／ '+d.length+'　'+(q.pre?q.pre:'日本語：'+q.tr)+'</p>'+legendHTML(q)+'<div class="slots">';
  for(var k=0;k<n;k++){
    var idx=s.placed[k];
    if(idx!==undefined){
      var it=q.items[idx];
      h+='<div class="slot filled"><span class="n">'+(k+1)+'番目</span><button class="chip r-'+it.r+'" data-rm="'+k+'"'+(s.ok?' disabled':'')+'>'+it.ja+'</button></div>';
    } else h+='<div class="slot"><span class="n">'+(k+1)+'番目</span></div>';
  }
  h+='</div><div class="pool">';
  q.items.forEach(function(it,idx){
    if(s.placed.indexOf(idx)<0) h+='<button class="chip r-'+it.r+'" data-add="'+idx+'">'+it.ja+'</button>';
  });
  h+='</div>';
  if(s.msg) h+='<div class="msg '+(s.ok?'ok':'ng')+'" role="status">'+s.msg+'</div>';
  if(s.ok){
    h+=engHTML(q)+'<p class="ja">'+q.tr+'</p><button class="speak" data-au="'+q.au+'">もう一度聞く</button>'+
       '<div class="point">'+ptOf(q)+'</div><button class="next" data-a="next">'+(i===d.length-1?'おわり':'つぎへ')+'</button>';
  } else if(s.locked){
    h+='<button class="next ghost" data-a="reset">やり直す</button>';
  }
  h+='</div>';
  $app.innerHTML=h;
}
function check1(){
  var q=data()[i], s=st.q1, exp=expOrder(q);
  var roles=s.placed.map(function(k){return q.items[k].r;});
  var good=s.placed.every(function(k,n){return q.items[k].r===q.items[exp[n]].r;});
  if(good){s.ok=true;s.msg='正解！ 英語の順番になったよ。';mark();playAu(q.au);return;}
  s.locked=true;
  var rv=revBtn(q,1);
  if(q.svo){
    var es=exp.map(function(k){return q.items[k].r;}), bs=0;
    for(var zs=0;zs<roles.length;zs++){ if(roles[zs]!==es[zs]){bs=zs;break;} }
    var RS={S:'主語（だれが）',V:'動詞（どうする・です）',O:'なにを（数や a・an もいっしょに）',C:'なに・どんな',M:'どこに（場所・時）'};
    if(q.thr){ RS.V=q.q?'Is there / Are there（ありますか）':'There is / There are（あります・います）'; RS.O='なにが（名詞）'; }
    s.msg=(bs+1)+'番目は<b>'+RS[es[bs]]+'</b>だよ。'+(q.thr?(q.q?'疑問文は<b>Is / Are が最初</b>。順番は「Is there → なにが → どこに」。':'順番は「There is / are → なにが → どこに」。日本語の「あります」は最後だけど、英語は<b>最初</b>。'):'順番は「だれが → どうする（です）→ なにを・どこに」。')+rv;
  } else if(q.pst){
    var ep2=exp.map(function(k){return q.items[k].r;}), bp2=0;
    for(var z3=0;z3<roles.length;z3++){ if(roles[z3]!==ep2[z3]){bp2=z3;break;} }
    var RJ={S:'主語（だれが）',D:q.pst==='q'?'Did':'did not',V:q.pst==='pos'?'動詞の過去形':'動詞（原形）',O:'なにを',M:'いつ・どこで'};
    var tl=q.pst==='pos'?'順番は「だれが → どうした（過去形）→ なにを → いつ」。':(q.pst==='neg'?'順番は「だれが → did not → 原形 → なにを」。日本語の「ませんでした」は最後だけど、英語は動詞の<b>前</b>。':'順番は「Did → 主語 → 原形 → なにを」。疑問文は<b>Did が最初</b>。日本語の「あなたは」につられないでね。');
    s.msg=(bp2+1)+'番目は<b>'+RJ[ep2[bp2]]+'</b>だよ。'+tl+rv;
  } else if(q.imp){
    var ei=exp.map(function(k){return q.items[k].r;}), bi=0;
    for(var zi=0;zi<roles.length;zi++){ if(roles[zi]!==ei[zi]){bi=zi;break;} }
    var RI={D:q.imp==='lets'?"Let's（〜しましょう）":'Do not（〜してはいけません）',V:'動詞（原形）',O:'なにを',M:'いつ・どこで'};
    var tail=q.imp==='pos'?'命令文は<b>主語がなく、動詞が1番目</b>。「なにを」は動詞のあと。':(q.imp==='neg'?'順番は「Do not → 動詞 → なにを」。日本語の「いけません」は最後だけど、英語は<b>最初</b>。':"順番は「Let's → 動詞 → なにを」。日本語の「ましょう」は最後だけど、英語は<b>最初</b>。");
    s.msg=(bi+1)+'番目は<b>'+RI[ei[bi]]+'</b>だよ。'+tail+rv;
  } else if(q.prog){
    var RP={S:'主語',D:q.q?'be動詞（Am・Are・Is）':'be動詞（am・are・is）',V:'動詞のing形',O:'なにを',M:'いつ・どこで'};
    var ep=exp.map(function(k){return q.items[k].r;}), bp=0;
    for(var zz=0;zz<roles.length;zz++){ if(roles[zz]!==ep[zz]){bp=zz;break;} }
    s.msg=(bp+1)+'番目は<b>'+RP[ep[bp]]+'</b>だよ。'+(q.q?(bp===0?'疑問文は<b>be動詞が文の最初</b>。日本語の「あなたは」につられて You から始めないでね。':'順番は「be動詞 → 主語 → 動詞ing → なにを」。'):(bp===1?'日本語の「〜ている」は最後だけど、英語の be動詞は<b>主語のすぐあと</b>。':'順番は「だれが → be動詞 → 動詞ing → なにを」。'))+rv;
  } else if(q.wh){
    var RN={Q:'疑問詞（What・Where など）',V:q.g?'動詞（s なし）':'be動詞（is・are）',D:'Do / Does',S:'主語',O:'なにを',C:'中身'};
    var er=exp.map(function(k){return q.items[k].r;}), bad=0;
    for(var z=0;z<roles.length;z++){ if(roles[z]!==er[z]){bad=z;break;} }
    s.msg=(bad+1)+'番目は<b>'+RN[er[bad]]+'</b>だよ。'+(bad===0?'日本語は疑問詞が途中にあるけど、英語は<b>文の最初</b>に出すよ。':q.g?'順番は「疑問詞 → Do / Does → 主語 → 動詞」。':'順番は「疑問詞 → be動詞 → 主語」。')+rv;
  } else if(q.g){
    if(q.q){
      if(roles[0]!=='D') s.msg='一般動詞の疑問文は、<b>Do / Does</b> が<b>1番目</b>。日本語の「あなたは」につられて You から始めないでね。'+rv;
      else if(roles[1]!=='S') s.msg='2番目は<b>主語</b>（だれが）。Do のあとに置くよ。'+rv;
      else if(roles[2]!=='V') s.msg='3番目は<b>動詞</b>。主語のすぐあとだよ。'+rv;
      else s.msg='最後は<b>なにを</b>（いつ・どこで）。動詞のあとに置くよ。'+rv;
    } else {
      if(roles[0]!=='S') s.msg='英語は、まず「<b>だれが</b>」。主語（青）が1番目だよ。'+rv;
      else if(roles[1]!=='D') s.msg='2番目は <b>do not / does not</b>。日本語の「〜ない」は最後だけど、英語は動詞の<b>前</b>に置くよ。'+rv;
      else if(roles[2]!=='V') s.msg='3番目は<b>動詞</b>。do not のすぐあとだよ。'+rv;
      else s.msg='最後は<b>なにを</b>（いつ・どこで）。動詞のあとに置くよ。'+rv;
    }
  } else if(q.q){
    if(roles[0]!=='V') s.msg='疑問文は<b>be動詞</b>（Are・Is・Am）が<b>1番目</b>。日本語の「あなたは」につられて You から始めないでね。'+rv;
    else if(roles[1]!=='S') s.msg='2番目は<b>主語</b>。be動詞のあとに「だれが」を置くよ。'+rv;
    else s.msg='最後は<b>中身</b>（なに・どんな）。'+rv;
  } else if(roles[0]!=='S') s.msg='英語は、まず「<b>だれが</b>」。主語（青）が1番目だよ。'+rv;
  else if(roles[1]!=='V') s.msg=(q.be?'2番目は<b>be動詞</b>（です）。日本語の「です」は最後だけど、英語は主語のすぐあとに置くよ。':'2番目は<b>動詞</b>（赤）。主語のすぐあとに「どうする」を置くのが英語です。')+rv;
  else s.msg=(q.be?'最後は<b>中身</b>（なに・どんな）。be動詞のあとに置くよ。':'動詞のあとに「<b>なにを</b>」。「いつ・どこで」などの時や場所を表す語は、いちばん最後に置きます。')+rv;
}

    'can の疑問文は「Can ＋ 主語 ＋ 動詞?」。答え方は Yes, I can. / No, I cannot. です。',
    'can の肯定・否定・疑問を見分けて答えられました。',
    'What・Who・Where・When・Why の意味と、こたえの種類が分かりました。',
    '疑問詞は文の最初。「疑問詞 → be動詞 → 主語」で作れるようになりました。',
    '「疑問詞 → do / does → 主語 → 動詞」で作れるようになりました。答え方は中身を言うことです。',
    '疑問詞の問題を見分けて答えられました。',
    'How の使い分け（old・many・much）と、答え方が分かりました。',
    'Which・Whose・Why の使い分けと、Because での答え方が分かりました。',
    '疑問詞の問題を、たくさんの種類の中から見分けて答えられました。',
    '「be動詞＋動詞ing」で、今していることが言えるようになりました。ing の作り方も分かりました。',
    '進行形の否定は「be動詞＋not＋動詞ing」。do / does not とのちがいが分かりました。',
    '進行形の疑問は「be動詞を最初に」。答え方と What are you doing? が分かりました。',
    '進行形の肯定・否定・疑問を見分けて答えられました。',
    '命令文は「主語なし、動詞（原形）で始める」。ふつうの文とのちがいが分かりました。',
    '「Do not ＋ 動詞」で、禁止の文が作れるようになりました。',
    "Please・Let's・Be の命令文が使えるようになりました。",
    '命令文の問題を見分けて答えられました。',
    '「〜でした」は was / were。主語によって使い分けることが分かりました。',
    '過去の否定は「was / were ＋ not」。',
    '過去の疑問は「Was / Were を最初に」。答え方と Where were you? が分かりました。',
    'be動詞の過去形の肯定・否定・疑問を見分けて答えられました。',
    '動詞に ed をつけて、前のことが言えるようになりました。ed のつけ方も分かりました。',
    'go→went など、形がかわる動詞の過去形が分かりました。',
    '過去の否定は「did not ＋ 動詞（原形）」。動詞がもとの形にもどることが分かりました。',
    '過去の疑問は「Did ＋ 主語 ＋ 原形?」。答え方と What did you do? が分かりました。',
    '過去形の肯定・否定・疑問を見分けて答えられました。ここまでで、中学1年の基本の文がそろいました。',
    '',
    '1つのものには a / an、母音の音の前は an。もう話に出たものは the、と使い分けられるようになりました。',
    '複数形の s・es・ies と、形がかわる複数形が分かりました。',
    'this・that・these・those を、近い・遠い、1つ・複数で使い分けられるようになりました。',
    '前置詞が何かが分かり、場所の on・in・under が使い分けられるようになりました。',
    '時の at・on・in、before・after、with・without などが使い分けられるようになりました。',
    '名詞・冠詞・前置詞の問題を見分けて答えられました。',
    '「〜があります・います」は There is / are。あとの名詞の数で is / are を選べるようになりました。',
    'There is / are の否定は「be動詞のあとに not」。複数では some が any にかわることが分かりました。',
    'There の疑問文は「Is / Are を最初に」。答え方と How many 〜 are there? が分かりました。',
    'There is / are の肯定・否定・疑問を見分けて答えられました。'];
  h+='<p>'+msgs[ch]+'</p>';
  if(ch<NCH-1) h+='<button class="next" data-ch="'+(ch+1)+'">'+TABS[ch+1]+'へ</button>';
  else h+='<p class="sub">試作はここまでです。使ってみて、気づいたことを教えてください。</p>';
  h+=(MIXMAP[ch])?'<button class="next ghost" data-a="shuffle">シャッフルしなおして、もう一度</button>':'<button class="next ghost" data-a="again">この章をもう一度</button>';
  h+='</div>';
  $app.innerHTML=h;
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.ch!==undefined){ch=+t.dataset.ch;i=-1;st={};render();window.scrollTo(0,0);return;}
  if(t.dataset.go!==undefined){i=+t.dataset.go;st={};review=false;render();return;}
  var a=t.dataset.a;
  if(a==='rv'){review=!review;render();return;}
  if(a==='start'){i=0;render();return;}
  if(a==='next'){i++;render();return;}
  if(a==='again'){i=-1;st={};render();return;}
  if(a==='shuffle'){mixBuild(ch);i=-1;st={};render();window.scrollTo(0,0);return;}
  if(a==='reset'){st.q1={key:ch+'-'+i,placed:[],msg:'',ok:false,locked:false};render();return;}
  if(t.dataset.au){playAu(t.dataset.au);return;}
  if(t.dataset.qg!==undefined && st.qi && st.qi.stage===1){
    var sq=st.qi,qq=data()[i];
    if(+t.dataset.qg===0){sq.stage=2;sq.msg='そう！ '+qq.d+' は文の<b>いちばん最初</b>。'+(qq.s2.k==='verb'?'次は、動詞の形を選ぼう。':'次は、最後の記号を選ぼう。');}
    else sq.msg='そこではないよ。疑問文の <b>'+qq.d+'</b> は、文の<b>いちばん最初</b>に置くよ。';
    render();return;
  }
  if(t.dataset.qm!==undefined && st.qi && st.qi.stage===1){
    var sm2=st.qi,qm2=data()[i];
    if(+t.dataset.qm===qm2.mvi){sm2.stage=2;sm2.msg='そう！ <b>'+qm2.words[qm2.mvi]+'</b> を文の最初に出すよ。主語のあとに can は残らないね。次は、最後の記号を選ぼう。';}
    else sm2.msg='ちがうよ。疑問文では <b>'+qm2.words[qm2.mvi]+'</b> を文の最初に動かすよ。';
    render();return;
  }
  if(t.dataset.qo!==undefined && st.qi && st.qi.stage===2){
    var s3=st.qi,q3=data()[i], o=t.dataset.qo;
    if(o===q3.s2.ans){s3.stage=3;s3.ok=true;s3.msg='正解！ 疑問文の完成。';mark();playAu(q3.au);}
    else s3.msg=q3.s2.why[o]||'ちがうよ。';
    render();return;
  }
  if(t.dataset.gap!==undefined && st.ins){
    var si=st.ins,qi=data()[i]; if(si.ok) return;
    var g=+t.dataset.gap;
    if(g===qi.ans){si.ok=true;si.msg=qi.okmsg?qi.okmsg:qi.ins?'正解！ do not は主語のすぐあと、動詞の前。':'正解！ not は be動詞のすぐあと。';mark();playAu(qi.au);}
    else if(qi.wmsg) si.msg=qi.wmsg;
    else if(qi.ins) si.msg='そこは動詞の<b>あと</b>。do not は動詞の<b>前</b>（主語のすぐあと）に入れるよ。';
    else si.msg=(g<qi.ans)?'そこは be動詞の<b>前</b>。not は be動詞の<b>あと</b>に入れるよ。':'そこは be動詞から<b>離れすぎ</b>。not は be動詞のすぐあとだよ。';
    render();return;
  }
  if(t.dataset.mc!==undefined && st.mc){
    var sm=st.mc,qm=data()[i]; if(sm.ok) return;
    var c=t.dataset.mc;
    if(c===qm.ans){sm.ok=true;sm.msg='正解！';mark();playAu(qm.au);}
    else sm.msg='「'+c+'」ではないよ。'+((qm.why&&qm.why[c])||qm.reason||'');
    render();return;
  }
  if(t.dataset.pr!==undefined && st.pr){
    var s3=st.pr,q3=data()[i]; if(s3.ok) return;
    if(t.dataset.pr===q3.ans){s3.ok=true;s3.msg='正解！';mark();playAu(q3.au);}
    else s3.msg='「'+disp(q3,t.dataset.pr)+'」ではないよ。'+pronReason(q3);
    render(); return;
  }
  if(t.dataset.p!==undefined && st.pk){
    var s2=st.pk,q2=data()[i]; if(s2.ok) return;
    if(t.dataset.p===q2.ans){s2.ok=true;s2.msg='正解！';mark();playAu(q2.au);}
    else s2.msg='「'+t.dataset.p+'」ではないよ。'+RULE[q2.rule];
    render(); return;
  }
  if(t.dataset.w!==undefined && st.cl){
    var k=+t.dataset.w; if(!st.cl.done[k]){st.cl.sel=k;st.cl.msg='';render();} return;
  }
  if(t.dataset.c && st.cl){
    var s=st.cl,q=data()[i]; if(s.sel===-1||s.sel===null) return;
    var p=q.parts[s.sel];
    if(p.k===t.dataset.c){
      s.done[s.sel]=true; s.msg='正解！「'+p.t+'」は'+KN[p.k]+'。'; s.ok=true;
      s.sel=nextTarget(q,s.done);
      if(s.sel===-1){mark(); if(q.au) playAu(q.au);}
    } else { s.msg=reason(q,p)+(q.be?'<br><button class="speak" data-ch="0">第0章で復習する</button>':''); s.ok=false; }
    render(); return;
  }
  if(t.dataset.add!==undefined && st.q1 && !st.q1.locked && !st.q1.ok){
    var s1=st.q1; s1.placed.push(+t.dataset.add); s1.msg='';
    if(s1.placed.length===data()[i].items.length) check1();
    render(); return;
  }
  if(t.dataset.rm!==undefined && st.q1 && !st.q1.locked && !st.q1.ok){
    st.q1.placed.splice(+t.dataset.rm,1); st.q1.msg=''; render(); return;
  }
});
render();
})();
</script>
</body>
