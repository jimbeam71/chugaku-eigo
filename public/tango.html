<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゼロから英語：単語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --fg:#1B2433; --muted:#5B6779; --line:#D5DDE8;
  --noun:#1F5FBF; --verb:#D13A3A; --adj:#4C8A0F; --adv:#6B52B0;
  --accent:#8A6D00; --fill:#F7E08A; --on:#3A2F05; --ok:#1B7F62; --ng:#D13A3A;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --en:"Nunito","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111823; --card:#1A2433; --fg:#E8EDF5; --muted:#9AA8BD; --line:#2B394E;
    --noun:#7DAEF5; --verb:#FF8080; --adj:#9BD35A; --adv:#B3A6E8;
    --accent:#E9D27A; --fill:#E9D27A; --on:#2A2205; --ok:#55CBA3; --ng:#FF8080; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:16px;line-height:1.7;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0;font-weight:700;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px}
button.go{background:var(--fill);color:var(--on);border-color:var(--accent);font-weight:700}
button.wide{width:100%;margin:6px 0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{flex:1 1 40%}
.en{font-family:var(--en);font-weight:800;font-size:40px;line-height:1.2;text-align:center;margin:8px 0}
.noun{color:var(--noun)} .verb{color:var(--verb)} .adj{color:var(--adj)} .adv{color:var(--adv)}
.pos{text-align:center;font-size:13px;font-weight:700}
.q{font-size:14px;color:var(--muted);text-align:center;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;font-size:20px;font-weight:700;margin:8px 0;min-height:56px}
.opt.ok{border-color:var(--ok);border-width:2px}
.opt.ng{border-color:var(--ng);border-width:2px}
.opt .small{display:block;font-family:var(--en);font-size:14px;font-weight:700;color:var(--muted)}
.fb{font-weight:800;font-size:18px;margin:4px 0}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
.exen{font-family:var(--en);font-weight:700;font-size:18px;margin:8px 0 0}
.exja{font-size:16px}
.tip{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.list{width:100%;border-collapse:collapse;font-size:15px}
.list td{border-bottom:1px solid var(--line);padding:6px 4px}
.list td:first-child{font-family:var(--en);font-weight:800}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ゼロから英語：単語</h1>
  <div class="sub">１日10語。見る → 聞く → 4つから選ぶ。まちがえても大丈夫。</div>
  <div id="app"></div>
  <p class="hint"><a href="index.html" style="color:var(--accent)">← 文法のページにもどる</a></p>
</div>
<script>
(function(){
var STORE='zero-tango-v1', DAYMS=86400000, STEPS=[1,3,7,21], MAXREV=15;
var WORDS=[], byId={}, st={words:{},perDay:10};
var app=document.getElementById('app');
try{var s=localStorage.getItem(STORE); if(s){var p=JSON.parse(s); if(p&&p.words) st=p; if(!st.perDay) st.perDay=10;}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(st));}catch(e){}}
function dayNum(t){return Math.floor((t||Date.now())/DAYMS);}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e;}
function posCls(p){return p==='動詞'?'verb':p==='形容詞'?'adj':p==='名詞'?'noun':'adv';}
function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a;}
var au=null;
function play(id,x){try{ if(au) au.pause(); au=new Audio('audio/w/'+id+(x?'x':'')+'.mp3'); var pr=au.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}}

function counts(){
  var seen=0, done=0, due=0, today=dayNum();
  WORDS.forEach(function(w){var r=st.words[w.id]; if(!r) return; seen++; if(r.step>=STEPS.length) done++; else if(r.due<=today) due++;});
  return {seen:seen,done:done,due:Math.min(due,MAXREV),dueAll:due};
}
function newToday(){
  var today=dayNum(), n=0; WORDS.forEach(function(w){var r=st.words[w.id]; if(r&&r.first===today) n++;}); return n;
}
function home(){
  app.innerHTML=''; var c=counts();
  var card=el('div','card');
  card.appendChild(el('div','',c.seen+' / '+WORDS.length+' 語に出会った。 覚えた（4回クリア）：'+c.done+' 語'));
  var bar=el('div','bar'); var i=el('i'); i.style.width=Math.round(c.seen/WORDS.length*100)+'%'; bar.appendChild(i); card.appendChild(bar);
  app.appendChild(card);
  var how=el('div','card'); how.appendChild(el('div','fb ok','使い方'));
  ['① 英語を見て、音を聞いて、意味を4つから選ぶ。','② 答えたあと、まちがえた選択肢にも、ぜんぶ例文がついているよ。タップして音声も聞いてね！','③ ミスしたほうが勉強になる。まちがえることは、おトクなんだ。'].forEach(function(t){ var q=el('div','',t); q.style.margin='4px 0'; how.appendChild(q); });
  app.appendChild(how);
  var left=Math.max(0,st.perDay-newToday()), unseen=WORDS.filter(function(w){return !st.words[w.id];}).length;
  var nNew=Math.min(left,unseen);
  var b1=el('button','go wide','今日の単語をはじめる（新しい語 '+nNew+'語 ＋ 復習 '+c.due+'語）');
  b1.onclick=function(){ startSession(nNew); };
  if(nNew+c.due===0){b1.textContent='今日の分はおわり！ えらい！'; b1.disabled=true; b1.style.opacity='.6';}
  app.appendChild(b1);
  var set=el('div','card'); set.appendChild(el('div','hint','1日に出会う新しい語の数'));
  var row=el('div','row');
  [5,10,20].forEach(function(n){var b=el('button',st.perDay===n?'go':'',n+'語'); b.onclick=function(){st.perDay=n; save(); home();}; row.appendChild(b);});
  set.appendChild(row); app.appendChild(set);
  var b2=el('button','wide','一覧で確認（全部の答えを見る）'); b2.onclick=listView; app.appendChild(b2);
  var b3=el('button','wide','記録を消して最初から'); b3.onclick=function(){ if(confirm('記録を全部消します。いいですか？')){st={words:{},perDay:st.perDay}; save(); home();} }; app.appendChild(b3);
}
function listView(){
  app.innerHTML='';
  var b=el('button','wide','← もどる'); b.onclick=home; app.appendChild(b);
  var card=el('div','card'); var t=el('table','list');
  WORDS.forEach(function(w){
    var tr=el('tr'); var a=el('td','',w.en); a.classList.add(posCls(w.pos));
    var m=el('td','',w.ja+'（'+w.pos+'）'); var s=el('td'); var pb=el('button','','♪'); pb.style.minHeight='40px'; pb.onclick=function(){play(w.id,false);}; s.appendChild(pb);
    tr.appendChild(a); tr.appendChild(m); tr.appendChild(s); t.appendChild(tr);
  });
  card.appendChild(t); app.appendChild(card);
}
function choices(w){
  var pool=WORDS.filter(function(o){return o.id!==w.id && !(w.grp && o.grp===w.grp);});
  var same=shuffle(pool.filter(function(o){return o.pos===w.pos;}));
  var other=shuffle(pool.filter(function(o){return o.pos!==w.pos;}));
  var pick=same.slice(0,3); if(pick.length<3) pick=pick.concat(other.slice(0,3-pick.length));
  return shuffle([w].concat(pick));
}
var queue=[], total=0, idx=0;
function startSession(nNew){
  var today=dayNum(), rev=[], news=[];
  WORDS.forEach(function(w){var r=st.words[w.id]; if(r&&r.step<STEPS.length&&r.due<=today) rev.push(w);});
  rev=shuffle(rev).slice(0,MAXREV);
  WORDS.forEach(function(w){ if(!st.words[w.id] && news.length<nNew) news.push(w); });
  queue=shuffle(rev.concat(news)); total=queue.length; idx=0; question();
}
function question(){
  app.innerHTML='';
  if(idx>=queue.length){ var d=el('div','card'); d.appendChild(el('div','fb ok','今日の分、おわり！'));
    d.appendChild(el('div','','また明日。復習は自動で出るよ。')); app.appendChild(d);
    var b=el('button','go wide','トップにもどる'); b.onclick=home; app.appendChild(b); return; }
  var w=queue[idx];
  var prog=el('div','hint',(idx+1)+' / '+total); app.appendChild(prog);
  var card=el('div','card');
  var en=el('div','en '+posCls(w.pos),w.en); card.appendChild(en);
  card.appendChild(el('div','pos '+posCls(w.pos),w.pos));
  var pb=el('button','wide','♪ 音を聞く'); pb.onclick=function(){play(w.id,false);}; card.appendChild(pb);
  card.appendChild(el('div','q','意味はどれ？（まちがえてもOK。ミスしたほうが勉強になる）'));
  var box=el('div'); var answered=false;
  choices(w).forEach(function(o){
    var b=el('button','opt',o.ja);
    b.onclick=function(){
      if(answered){ // 答えたあと：どの選択肢もタップすると英語と例文が出る
        showOne(o,detail); return; }
      answered=true;
      var ok=(o.id===w.id);
      record(w,ok);
      Array.prototype.forEach.call(box.children,function(x){ if(x.textContent===w.ja) x.classList.add('ok'); });
      if(!ok) b.classList.add('ng');
      var fb=el('div','fb '+(ok?'ok':'ng'),ok?'せいかい！':'ざんねん。答えは「'+w.ja+'」'); box.parentNode.insertBefore(fb,box);
      play(w.id,false);
      showOne(w,detail);
      var next=el('button','go wide',idx+1<queue.length?'つぎへ':'おわる'); next.onclick=function(){idx++; question();};
      card.appendChild(next);
      var tipbox=el('div','tip','まちがえた選択肢にも、ぜんぶ例文がついているよ。タップして、♪で音声も聞いてね！ミスしたほうが勉強になる。'); tipbox.style.fontWeight='700'; card.appendChild(tipbox);
    };
    box.appendChild(b);
  });
  card.appendChild(box);
  var detail=el('div'); card.appendChild(detail);
  app.appendChild(card);
  setTimeout(function(){play(w.id,false);},150);
}
function showOne(o,detail){
  detail.innerHTML='';
  var d=el('div','tip');
  var h=el('div','exen '+posCls(o.pos),o.en+'  = '+o.ja); d.appendChild(h);
  d.appendChild(el('div','exen',o.ex));
  d.appendChild(el('div','exja',o.exJa));
  d.appendChild(el('div','hint','ヒント：'+o.tip));
  var r=el('div','row'); var b1=el('button','','♪ 単語'); b1.onclick=function(){play(o.id,false);}; var b2=el('button','','♪ 例文'); b2.onclick=function(){play(o.id,true);};
  r.appendChild(b1); r.appendChild(b2); d.appendChild(r);
  detail.appendChild(d);
}
function record(w,ok){
  var today=dayNum(), r=st.words[w.id];
  if(!r){ r={step:0,due:today,first:today}; st.words[w.id]=r;
    if(ok){ r.step=1; r.due=today+STEPS[1]; } else { r.step=0; r.due=today+1; }
  } else {
    if(ok){ r.step=Math.min(STEPS.length,r.step+1); r.due=today+(STEPS[r.step]||999); } else { r.step=0; r.due=today+1; }
  }
  save();
}
fetch('data/tango.json').then(function(r){return r.json();}).then(function(d){
  WORDS=d; d.forEach(function(w){byId[w.id]=w;}); home();
}).catch(function(){ app.textContent='単語データを読みこめませんでした。ページを開きなおしてください。'; });
})();
</script>
</body>
</html>
