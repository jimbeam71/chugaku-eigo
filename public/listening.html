<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゼロから英語：リスニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --fg:#1B2433; --muted:#5B6779; --line:#D5DDE8;
  --accent:#8A6D00; --fill:#F7E08A; --on:#3A2F05; --ok:#1B7F62; --ng:#D13A3A; --sel:#DCEBFF;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --en:"Nunito","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111823; --card:#1A2433; --fg:#E8EDF5; --muted:#9AA8BD; --line:#2B394E;
    --accent:#E9D27A; --fill:#E9D27A; --on:#2A2205; --ok:#55CBA3; --ng:#FF8080; --sel:#27405F; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:16px;line-height:1.7;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0;font-weight:700;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px}
button.go{background:var(--fill);color:var(--on);border-color:var(--accent);font-weight:700}
button.wide{width:100%;margin:6px 0}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.sec{font-weight:800;color:var(--accent);font-size:15px}
.ins{font-size:14px;color:var(--muted);margin:4px 0 8px}
.playst{font-weight:700;margin:6px 0;min-height:1.6em}
textarea{width:100%;min-height:90px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--fg);margin:6px 0}
.qn{font-weight:800;margin:12px 0 4px}
.ch{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.ch .tx{flex:1;font-family:var(--en);font-weight:700;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.ch button{min-width:56px}
.ch button.on{background:var(--sel);border-color:var(--accent);font-weight:800}
.opt{display:block;width:100%;text-align:left;font-family:var(--en);font-weight:700;font-size:17px;margin:6px 0;min-height:52px}
.opt.on{background:var(--sel);border-color:var(--accent);border-width:2px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{font-size:44px;text-align:center;min-height:84px}
.pic.on{background:var(--sel);border-color:var(--accent);border-width:3px}
.pic small{display:block;font-size:12px;color:var(--muted);font-family:var(--jp)}
.ok{color:var(--ok);font-weight:800} .ng{color:var(--ng);font-weight:800}
.big{font-size:34px;font-weight:800;text-align:center;color:var(--accent)}
details{margin:8px 0} summary{cursor:pointer;font-weight:700}
.scr{font-family:var(--en);font-size:15px;margin:4px 0}
.row{display:flex;gap:8px}
.row button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>ゼロから英語：リスニング</h1>
  <div class="sub">高校入試の聞き取りを、本番と同じ形で練習しよう。</div>
  <div id="app"></div>
  <p class="hint"><a href="index.html" style="color:var(--accent)">← 文法のページにもどる</a></p>
</div>
<script>
(function(){
var app=document.getElementById('app'), curId=null, SET=null, step=0, ans={}, memo={}, checked={}, au=null, timer=null, STEPS=[], nextBtn=null;
var K3=['ア','イ','ウ'], K4=['ア','イ','ウ','エ'], L=['a','b','c'];
function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e;}
function stopAudio(){ if(timer){clearTimeout(timer); timer=null;} if(au){au.onended=null; try{au.pause();}catch(e){} au=null;} }
function playSeq(file,st,btn,times){
  stopAudio(); btn.disabled=true; var n=0;
  function run(){
    n++; st.textContent=times>1?('放送中… '+n+'回目 / '+times+'回'):'放送中…';
    au=new Audio('audio/l/'+file+'.mp3');
    au.onended=function(){
      if(n<times){ st.textContent='つぎの放送まで少し待つ…'; timer=setTimeout(run,3000); }
      else{ st.textContent='放送おわり。何回でも聞けるよ。'; btn.disabled=false; }
    };
    var p=au.play(); if(p&&p.catch) p.catch(function(){ st.textContent='音が出せませんでした。もう一度ボタンを押してください。'; btn.disabled=false; });
  }
  run();
}
function player(file){
  var box=el('div'), st=el('div','playst','');
  var r=el('div','row');
  var b2=el('button','go','▶ 本番どおり（2回）'), b1=el('button','','▶ 1回だけ聞く'), bs=el('button','','■ とめる');
  b2.onclick=function(){ playSeq(file,st,b2,2); }; b1.onclick=function(){ playSeq(file,st,b1,1); };
  bs.onclick=function(){ stopAudio(); st.textContent='とめました。'; b1.disabled=false; b2.disabled=false; };
  r.appendChild(b2); r.appendChild(b1); r.appendChild(bs); box.appendChild(r); box.appendChild(st); return box;
}
function home(){
  stopAudio(); app.innerHTML='';
  var c=el('div','card');
  c.appendChild(el('div','sec','高校入試にあわせた形'));
  ['A：短い対話と質問を聞いて、正しい答えをa・b・cから選ぶ。','B：対話を聞いて、答えにあたる絵を選ぶ。','C：長い放送（パート1）と長い対話（パート2）を聞いて、3問ずつ答える。','放送はぜんぶ2回。メモを取ってOK。'].forEach(function(t){var d=el('div','',t); d.style.margin='4px 0'; c.appendChild(d);});
  app.appendChild(c);
  var c2=el('div','card'); c2.appendChild(el('div','sec','練習のしかた'));
  ['① 1問ずつ聞く。何回でも聞いていい（「1回だけ」ボタンで何度でも）。','② 答えを選んだら「答え合わせ」。英語の全文と日本語訳が出るよ。','③ 全文を見ながら、もう一度聞こう。聞き取れなかった所がわかる。'].forEach(function(t){var d=el('div','',t); d.style.margin='4px 0'; c2.appendChild(d);});
  app.appendChild(c2);
  var lst=el('div'); app.appendChild(lst); lst.appendChild(el('div','hint','読みこみ中…'));
  fetch('data/listening/index.json').then(function(r){return r.json();}).then(function(ix){
    lst.innerHTML=''; ix.forEach(function(it){ var b=el('button','go wide',it.title+'　（'+it.note+'）'); b.onclick=function(){ curId=it.id; start(it.id); }; lst.appendChild(b); });
  }).catch(function(){ lst.textContent='一覧を読みこめませんでした。'; });
  app.appendChild(el('div','hint','※音声はオリジナルです。過去問そのものではありません。形・長さ・速さを入試にあわせています。'));
}
function start(id){
  fetch('data/listening/'+id+'.json').then(function(r){return r.json();}).then(function(d){
    SET=d; STEPS=[]; (d.A||[]).forEach(function(_,i){STEPS.push({k:'A',i:i});}); (d.B||[]).forEach(function(_,i){STEPS.push({k:'B',i:i});}); if(d.C1) STEPS.push({k:'C1'}); if(d.C2) STEPS.push({k:'C2'}); step=0; ans={}; memo={}; checked={}; show();
  }).catch(function(){ app.textContent='データを読みこめませんでした。ページを開きなおしてください。'; });
}
function memoBox(key){ var t=el('textarea'); t.placeholder='メモ（聞きながら書いてOK）'; t.value=memo[key]||''; t.oninput=function(){memo[key]=t.value;}; return t; }
function complete(s){
  if(s.k==='A') return ans['A'+s.i]!==undefined;
  if(s.k==='B') return ans['B'+s.i]!==undefined;
  if(s.k==='C1') return [0,1,2].every(function(j){return ans['C1_'+j]!==undefined;});
  return [0,1,2].every(function(j){return ans['C2_'+j]!==undefined;});
}
function updBtn(){ if(nextBtn) nextBtn.disabled=!complete(STEPS[step]); }
function judgeOK(key,correct){ return ans[key]===correct; }
function judgeRows(key,choices,locked){
  var wrap=el('div');
  (function draw(){
    wrap.innerHTML='';
    choices.forEach(function(c,j){ var b=el('button','opt'+(ans[key]===j?' on':''),L[j]+'.  '+c); b.disabled=locked; b.onclick=function(){ ans[key]=j; draw(); updBtn(); }; wrap.appendChild(b); });
  })();
  return wrap;
}
// 1ステップぶんの採点と全文
function stepInfo(s){
  var rows=[], blocks=[];
  if(s.k==='A'){ var it=SET.A[s.i];
    rows.push({label:'A No.'+(s.i+1),ok:judgeOK('A'+s.i,it.ans),detail:'質問：'+it.q+'　正解：'+L[it.ans]+'. '+it.choices[it.ans],why:it.why});
    blocks.push({title:'A No.'+(s.i+1)+' 全文',file:SET.id+'-A'+(s.i+1),lines:it.script.concat(['Question: '+it.q]).concat(it.choices.map(function(c,m){return L[m].toUpperCase()+'. '+c;})),ja:it.ja});
  } else if(s.k==='B'){ var it=SET.B[s.i];
    rows.push({label:'B No.'+(s.i+1),ok:ans['B'+s.i]===it.ans,detail:'質問：'+it.q+'　正解：'+K4[it.ans]+'（'+it.labels[it.ans]+'）',why:it.why});
    blocks.push({title:'B No.'+(s.i+1)+' 全文',file:SET.id+'-B'+(s.i+1),lines:it.script.concat(['Question: '+it.q]),ja:it.ja});
  } else if(s.k==='C1'){
    SET.C1.qs.forEach(function(q,j){ rows.push({label:'C パート1 No.'+(j+1),ok:ans['C1_'+j]===q.ans,detail:'質問：'+q.q+'　正解：'+K3[q.ans]+'. '+q.choices[q.ans],why:q.why}); });
    blocks.push({title:'C パート1 全文',file:SET.id+'-C1',lines:SET.C1.script.concat(SET.C1.qs.map(function(q,j){return 'Number '+(j+1)+'. '+q.q;})),ja:SET.C1.ja});
  } else {
    SET.C2.qs.forEach(function(q,j){ rows.push({label:'C パート2 No.'+(j+1),ok:judgeOK('C2_'+j,q.ans),detail:'質問：'+q.q+'　正解：'+L[q.ans]+'. '+q.choices[q.ans],why:q.why}); });
    blocks.push({title:'C パート2 全文',file:SET.id+'-C2',lines:SET.C2.script.concat(SET.C2.qs.map(function(q,j){return 'Number '+(j+1)+'. '+q.q;})),ja:SET.C2.ja});
  }
  return {rows:rows,blocks:blocks};
}
function drawInfo(info,open){
  var box=el('div');
  info.rows.forEach(function(r){ var d=el('div','card'); d.appendChild(el('div',r.ok?'ok':'ng',(r.ok?'○ ':'× ')+r.label)); d.appendChild(el('div','',r.detail)); d.appendChild(el('div','hint','ポイント：'+r.why)); box.appendChild(d); });
  info.blocks.forEach(function(bk){
    var d=el('div','card'); d.appendChild(el('div','sec',bk.title));
    var b=el('button','wide','▶ 聞きながら読む（1回）'); b.onclick=function(){ stopAudio(); au=new Audio('audio/l/'+bk.file+'.mp3'); var p=au.play(); if(p&&p.catch) p.catch(function(){}); }; d.appendChild(b);
    var bs=el('button','wide','■ とめる'); bs.onclick=stopAudio; d.appendChild(bs);
    bk.lines.forEach(function(t){ d.appendChild(el('div','scr',t)); });
    var j=el('div','hint',bk.ja); j.style.marginTop='8px'; d.appendChild(j); box.appendChild(d);
  });
  return box;
}
function show(){
  stopAudio(); app.innerHTML=''; var s=STEPS[step], locked=!!checked[step];
  app.appendChild(el('div','hint',(step+1)+' / '+STEPS.length));
  var card=el('div','card');
  if(s.k==='A'){
    var it=SET.A[s.i];
    card.appendChild(el('div','sec','A　No.'+(s.i+1)));
    card.appendChild(el('div','ins','対話と質問を聞いて、正しい答えをa・b・cから1つ選ぶ。'));
    card.appendChild(player(SET.id+'-A'+(s.i+1))); card.appendChild(memoBox('A'+s.i));
    card.appendChild(judgeRows('A'+s.i,it.choices,locked));
  } else if(s.k==='B'){
    var it=SET.B[s.i];
    card.appendChild(el('div','sec','B　No.'+(s.i+1)));
    card.appendChild(el('div','ins','対話と質問を聞いて、答えを表す絵をア〜エから1つ選ぶ。'));
    card.appendChild(player(SET.id+'-B'+(s.i+1))); card.appendChild(memoBox('B'+s.i));
    var g=el('div','pics');
    (function drawB(){ g.innerHTML=''; it.options.forEach(function(o,j){ var b=el('button','pic'+(ans['B'+s.i]===j?' on':''),o); b.disabled=locked; b.appendChild(el('small','',K4[j])); b.onclick=function(){ ans['B'+s.i]=j; drawB(); updBtn(); }; g.appendChild(b); }); })();
    card.appendChild(g);
  } else if(s.k==='C1'){
    card.appendChild(el('div','sec','C　パート1'));
    card.appendChild(el('div','ins','ALTの先生の話を聞いて、3つの質問にア〜ウで答える。質問は放送で読まれます。'));
    card.appendChild(player(SET.id+'-C1')); card.appendChild(memoBox('C1'));
    SET.C1.qs.forEach(function(q,j){
      card.appendChild(el('div','qn','No.'+(j+1)));
      var box=el('div');
      (function d(){ box.innerHTML=''; q.choices.forEach(function(c,m){ var b=el('button','opt'+(ans['C1_'+j]===m?' on':''),K3[m]+'  '+c); b.disabled=locked; b.onclick=function(){ ans['C1_'+j]=m; d(); updBtn(); }; box.appendChild(b); }); })();
      card.appendChild(box);
    });
  } else {
    card.appendChild(el('div','sec','C　パート2'));
    card.appendChild(el('div','ins','二人の対話を聞いて、3つの質問に、a・b・cから1つずつ選んで答える。質問は放送で読まれます。'));
    card.appendChild(player(SET.id+'-C2')); card.appendChild(memoBox('C2'));
    SET.C2.qs.forEach(function(q,j){ card.appendChild(el('div','qn','No.'+(j+1))); card.appendChild(judgeRows('C2_'+j,q.choices,locked)); });
  }
  app.appendChild(card);
  var practice=(SET.mode==='practice');
  if(practice && !locked){
    nextBtn=el('button','go wide','答え合わせ'); nextBtn.disabled=true;
    nextBtn.onclick=function(){ checked[step]=true; stopAudio(); show(); };
    app.appendChild(nextBtn); updBtn();
  } else {
    if(locked) app.appendChild(drawInfo(stepInfo(s),true));
    nextBtn=el('button','go wide',step+1<STEPS.length?'つぎへ':'おわり（結果を見る）'); nextBtn.disabled=!complete(s);
    nextBtn.onclick=function(){ stopAudio(); if(step+1<STEPS.length){step++; show(); window.scrollTo(0,0);} else result(); };
    app.appendChild(nextBtn);
  }
}
function result(){
  stopAudio(); app.innerHTML=''; var total=0,max=0;
  STEPS.forEach(function(s){ stepInfo(s).rows.forEach(function(r){ max++; if(r.ok) total++; }); });
  var c=el('div','card'); c.appendChild(el('div','big',total+' / '+max));
  c.appendChild(el('div','hint','まちがえた問題は、全文を見ながら、もう一度聞こう。聞き取れなかった所に、線を引いてみよう。')); app.appendChild(c);
  var b1=el('button','go wide','もう一度やる'); b1.onclick=function(){ start(curId); }; app.appendChild(b1);
  var b2=el('button','wide','トップにもどる'); b2.onclick=home; app.appendChild(b2);
}
home();
})();
</script>
</body>
</html>
